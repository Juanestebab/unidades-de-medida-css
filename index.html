<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades de medida CSS</title>
    <style>
        h1 {font-size: 0.5in;
        }
        #caja { 
            width: 70%;
            background-color: aqua;
            height: 100vh;
        }
        p {font-size: 1.5em;}
        #titulo {
            background-color: yellow;
            width: 50%;
        }
    </style>
</head>
<body>
    
    <div id="caja">
        <div id="titulo">
            Esto es una subcaja
        </div>
        <h1>Unidades de medida CSS</h1>
        <P> A diferencia de HTML, en CSS se puede indicar el tamaño de los elemntos
            con distintas unidades. Por ejemplo: centimetros, pulgadas, pixeles...
        </P>
    </div>
    
</body>
</html>
